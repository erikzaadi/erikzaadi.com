name: CI FTW

on:
  push:
    branches: [ '**' ] # master deploys production, any other branch deploys the preview
    paths-ignore: [ 'terraform/**', '.github/workflows/verify-certs.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for the AWS deploy role
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Cache bin
        uses: actions/cache@v5
        with:
          path: bin
          key: bin-${{ hashFiles('install.sh') }}

      - name: Install
        run: ./install.sh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Compile
        run: ./ci.sh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Deploy
        run: ./deploy.sh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}

  notify_success:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: notify
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: ./notify.sh
